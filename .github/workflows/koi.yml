# Redraws koi/koi.gif nightly from public GitHub activity (github.com/yalongwastaken/git-koi).
# Action pinned to the v1.0.2 commit so an upstream change can't run here unreviewed.
name: Koi

on:
  schedule:
    - cron: "20 0 * * *" # 02:20 SAST, just after the UTC day ends
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: gold
          output-dir: koi
      - name: Commit the koi if it changed
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "Koi unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
