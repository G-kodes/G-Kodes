<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Graeme Ford, Data Engineer</title>
<desc id="d">Banner with Graeme's name and title beside an animated three-stage data pipeline: ingest, transform, load.</desc>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.pk{animation:flow 4s linear infinite;opacity:0}
@keyframes flow{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(370px);opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pk,.cur{animation:none}.pk{opacity:0}}
</style>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/></pattern></defs>
<rect width="1200" height="320" rx="16" fill="#0d1117"/>
<rect width="1200" height="320" rx="16" fill="url(#g)"/>
<text x="64" y="112" class="mono" font-size="18" fill="#2dd4bf">~/graeme $ whoami<tspan class="cur">▍</tspan></text>
<text x="64" y="176" class="sans" font-size="64" font-weight="700" fill="#e6edf3">Graeme Ford</text>
<text x="64" y="218" class="sans" font-size="24" fill="#e6edf3">Data Engineer · Python, SQL &amp; pipeline automation</text>
<text x="64" y="256" class="mono" font-size="16" fill="#8b949e">2-day harvest → 15 min · 3 TB genomic workflow · Pretoria, ZA</text>
<line x1="730" y1="180" x2="1100" y2="180" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6"/>
<circle cx="730" cy="180" r="11" fill="#0d1117" stroke="#2dd4bf" stroke-width="2.5"/><text x="730" y="216" text-anchor="middle" class="mono" font-size="15" fill="#e6edf3">ingest</text><circle cx="915" cy="180" r="11" fill="#0d1117" stroke="#2dd4bf" stroke-width="2.5"/><text x="915" y="216" text-anchor="middle" class="mono" font-size="15" fill="#e6edf3">transform</text><circle cx="1100" cy="180" r="11" fill="#0d1117" stroke="#2dd4bf" stroke-width="2.5"/><text x="1100" y="216" text-anchor="middle" class="mono" font-size="15" fill="#e6edf3">load</text>
<circle class="pk" cx="730" cy="180" r="5" style="animation-delay:0.0s" fill="#2dd4bf"/><circle class="pk" cx="730" cy="180" r="5" style="animation-delay:0.8s" fill="#f97316"/><circle class="pk" cx="730" cy="180" r="5" style="animation-delay:1.6s" fill="#2dd4bf"/><circle class="pk" cx="730" cy="180" r="5" style="animation-delay:2.4000000000000004s" fill="#2dd4bf"/><circle class="pk" cx="730" cy="180" r="5" style="animation-delay:3.2s" fill="#f97316"/>
<text x="915" y="256" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">same input · same output · every run</text>
</svg>
